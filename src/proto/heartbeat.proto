  syntax = "proto3";


  import "google/protobuf/timestamp.proto";
  package heartbeat;

  // send and receive heartbeat
  service heartbeat {
  rpc heartbeat(request) returns (reply);
  }

 // heartbeat request
 message request {
 google.protobuf.Timestamp timestamp = 1;
 }

 // heartbest reply
 message reply {
  google.protobuf.Timestamp timestamp = 1;
 }
